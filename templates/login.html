<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 — 花蓮高商教師員額控管系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display:flex; flex-direction:column; min-height:100vh; margin:0; background:#f5f5f5; font-family: "Microsoft JhengHei", sans-serif; }
        .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
        .login-box { background:#fff; padding:2.5rem; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.08); max-width:420px; width:100%; text-align:center; }
        .login-box h1 { margin:0 0 .5rem; color:#333; font-size:1.5rem; }
        .login-box .sub { color:#666; margin-bottom:2rem; font-size:.95rem; line-height:1.6; }
        .gbtn-wrap { display:flex; justify-content:center; margin:1.5rem 0 .5rem; }
        .note { font-size:.85rem; color:#888; margin-top:1.5rem; line-height:1.5; }
        .err { background:#ffebee; color:#c62828; padding:.75rem; border-radius:6px; margin-top:1rem; font-size:.9rem; display:none; }
        .config-missing { background:#fff3e0; color:#e65100; padding:1rem; border-radius:6px; font-size:.9rem; line-height:1.6; text-align:left; }
        .config-missing code { background:#ffe0b2; padding:.1rem .3rem; border-radius:3px; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-box">
            <h1>花蓮高商教師員額控管系統</h1>
            <p class="sub">請使用校內 Google 帳號（@hlbh.hlc.edu.tw）登入</p>

            {% if google_client_id %}
                <div id="g_id_onload"
                     data-client_id="{{ google_client_id }}"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="gbtn-wrap">
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="left"
                         data-locale="zh_TW">
                    </div>
                </div>
                <div id="login-err" class="err"></div>
                <p class="note">
                    教務處三組（教務、教學、註冊）可編輯；其他校內同仁僅可檢視。<br>
                    非 @hlbh.hlc.edu.tw 帳號無法登入。
                </p>
            {% else %}
                <div class="config-missing">
                    <strong>系統尚未設定 Google 登入</strong><br><br>
                    請管理員設定環境變數 <code>GOOGLE_CLIENT_ID</code>。<br>
                    （本機測試：在 Console 執行 <code>set GOOGLE_CLIENT_ID=...</code> 再啟動 app.py）
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
    function handleCredentialResponse(response) {
        const token = response.credential;
        fetch('/api/google_login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: token })
        })
        .then(r => r.json().then(j => ({ ok: r.ok, j })))
        .then(({ ok, j }) => {
            if (ok && j.success) {
                const next = new URLSearchParams(location.search).get('next') || '/';
                location.href = next;
            } else {
                showError(j.message || '登入失敗');
            }
        })
        .catch(err => showError('網路錯誤：' + err.message));
    }

    function showError(msg) {
        const el = document.getElementById('login-err');
        el.textContent = msg;
        el.style.display = 'block';
    }
    </script>
</body>
</html>
